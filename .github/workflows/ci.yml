name: CI
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres-for-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://eli_app:local-app-password@127.0.0.1:5432/eli_test
      TEST_MIGRATION_DATABASE_URL: postgresql://eli_owner:local-owner-password@127.0.0.1:5432/eli_test
      MIGRATION_DATABASE_URL: postgresql://eli_owner:local-owner-password@127.0.0.1:5432/eli_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject high and critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm run generate
      - run: npm run check
      - name: Migrate a fresh PostgreSQL database
        run: |
          psql postgresql://postgres:postgres-for-ci@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -f scripts/provision-dev.sql
          npm run db:deploy
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -v runtime_role=eli_app -f scripts/database-grants.sql
          npm run db:deploy
          npm run db:status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build release container
        run: docker build -t eli-edtech:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
